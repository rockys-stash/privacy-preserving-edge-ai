[project]
name = "edgebench"
version = "0.1.0"
description = "Privacy-preserving edge AI benchmark: accuracy, privacy and compute cost of centralized, edge and fully local activity recognition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
edgebench = "edgebench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
  "playwright==1.56.0",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgebench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "E501"]


[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["edgebench"]
plugins = ["pydantic.mypy"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser tests (need built frontend + chromium)"]
addopts = "-m 'not ui'"
