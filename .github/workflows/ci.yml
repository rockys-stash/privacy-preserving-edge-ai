name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: har-2045e435c955214b
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run edgebench fetch
      - run: uv run pytest
      - name: Smoke run of E1-E5 (8 subjects, tiny models; checks the pipeline, not a result)
        run: make smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web audit --audit-level=moderate
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  ui:
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: har-2045e435c955214b
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: npm --prefix web ci --ignore-scripts
      - run: uv sync --locked
      - run: uv run edgebench fetch
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m ui
